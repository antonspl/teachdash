name: Task
description: A piece of work from the backlog
labels: ["type:task"]
body:
  - type: dropdown
    id: area
    attributes:
      label: Area
      options: [Backend, Frontend, DevOps]
    validations:
      required: true
  - type: input
    id: change
    attributes:
      label: OpenSpec change
      description: Folder under openspec/changes/, or "needs spec" if there is none yet
  - type: textarea
    id: what
    attributes:
      label: What and why
    validations:
      required: true
  - type: textarea
    id: done
    attributes:
      label: Done when
      description: How to verify the task is complete
