name: ci

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          cache-provider: basic
      - name: Test
        working-directory: backend
        run: ./gradlew cleanTest test
      - name: Count tests
        run: |
          rm -f backend/build/test-results/test/*.xml
          total=0
          files=0
          for file in backend/build/test-results/test/*.xml; do
            [ -e "$file" ] || continue
            files=$((files + 1))
            count=$(grep -m1 '<testsuite ' "$file" | sed -E 's/.* tests="([0-9]+)".*/\1/')
            total=$((total + count))
          done
          echo "Backend tests: $total in $files result files"
          if [ "$total" -eq 0 ]; then
            echo "No backend tests ran."
            exit 1
          fi
      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: backend-test-reports
          path: backend/build/reports/tests/
          retention-days: 7

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm test
      - run: npm run build

  coverage:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - run: scripts/check-scenario-coverage.sh

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # Pull requests run one desktop project; main and manual runs run all three.
      BROWSERS: ${{ github.event_name == 'pull_request' && 'chromium' || 'chromium webkit' }}
      PROJECT_ARGS: ${{ github.event_name == 'pull_request' && '--project=desktop-chromium' || '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Start the stack
        run: docker compose up --build --wait
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Install browsers
        working-directory: frontend
        run: npx --no-install playwright install --with-deps $BROWSERS
      - name: Run Playwright
        timeout-minutes: 10
        working-directory: frontend
        run: npm run test:e2e -- $PROJECT_ARGS
      - name: Upload Playwright output
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-output
          path: |
            frontend/playwright-report/
            frontend/test-results/
          retention-days: 7
      - name: Print compose logs
        if: failure()
        run: docker compose logs --no-color

  ci-ok:
    runs-on: ubuntu-latest
    needs: [backend, frontend, coverage, e2e]
    if: always()
    timeout-minutes: 2
    steps:
      - name: Require every job to succeed
        env:
          BACKEND: ${{ needs.backend.result }}
          FRONTEND: ${{ needs.frontend.result }}
          COVERAGE: ${{ needs.coverage.result }}
          E2E: ${{ needs.e2e.result }}
        run: |
          echo "backend=$BACKEND frontend=$FRONTEND coverage=$COVERAGE e2e=$E2E"
          for result in "$BACKEND" "$FRONTEND" "$COVERAGE" "$E2E"; do
            if [ "$result" != "success" ]; then
              echo "A required job did not succeed."
              exit 1
            fi
          done
