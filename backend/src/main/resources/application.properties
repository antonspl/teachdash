spring.application.name=teachdash
spring.session.jdbc.initialize-schema=never
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.forward-headers-strategy=native
logging.structured.format.console=ecs
management.endpoints.web.exposure.include=health
teachdash.rate-limit.join.max=30
teachdash.rate-limit.join.window=10m
teachdash.rate-limit.preview.max=120
teachdash.rate-limit.preview.window=10m
teachdash.rate-limit.max-keys=100000
