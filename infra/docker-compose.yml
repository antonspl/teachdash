name: teachdash

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-teachdash}
      POSTGRES_USER: ${POSTGRES_USER:-teachdash}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-teachdash-dev}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build: ../backend
    environment:
      SPRING_DATASOURCE_URL: ${SPRING_DATASOURCE_URL:-jdbc:postgresql://postgres:5432/teachdash}
      SPRING_DATASOURCE_USERNAME: ${SPRING_DATASOURCE_USERNAME:-teachdash}
      SPRING_DATASOURCE_PASSWORD: ${SPRING_DATASOURCE_PASSWORD:-teachdash-dev}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@example.com}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-admin-dev-password}
      ADMIN_NAME: ${ADMIN_NAME:-Admin}
      APP_BASE_URL: ${APP_BASE_URL:-http://localhost:5173}
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8080:8080"

volumes:
  pgdata:
