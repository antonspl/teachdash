schema: spec-driven

context: |
  Project: teachdash — a lightweight teaching platform for teachers of English
  and Russian (lessons, exercises, shared whiteboard, video calls). All learning
  content features must support both target languages; for now only the
  English–Russian pair, without hard-coding it (constitution section 9).
  Language: English. All artifacts must be written in English.
  Keep OpenSpec structural headings and SHALL/MUST keywords in English.
  The project constitution is openspec/constitution.md. Every artifact and all
  code MUST comply with it. Read it before creating any artifact.
  Stack: Java Spring Boot + PostgreSQL (Flyway) backend, React + TypeScript + Vite
  frontend, Docker Compose on one VPS behind Caddy.

rules:
  proposal:
    - Start with a "Clarifications" section listing the questions asked and the engineer's answers, or saying that the engineer skipped clarification and where the task comes from (e.g. the issue)
    - List the research angles agreed with the engineer and each one's conclusion, or say that none were done
    - State what is out of scope
  specs:
    - Every requirement has at least one Given/When/Then scenario
    - Give every scenario a stable ID in the form <capability>/R<n>-S<n>
  design:
    - Justify every new dependency
    - List Flyway migrations the change adds
  tasks:
    - Section 1 is "Failing tests" - one backend test per scenario (JUnit 5, Testcontainers, RestAssured), plus stubs (501, marked STUB) and schema migrations so tests compile and fail at their THEN step
    - Section 2 is a single task "Engineer approves tests in the PR" - a hard stop
    - Implementation tasks come only after the review task
    - 'End with a "Workflow follow-up" section: code review gate, archive in the same PR, mark the PR ready for the final code owner review'
    - 'Exception for a frontend-only change (no backend scenarios): no "Failing tests" section and no test review task. Each task group lands its own Vitest or Playwright tests, one per scenario, with "[<scenario ID>]" at the start of the test title. Tests and code are reviewed together at the code gate'
    - 'Exception for a tooling change (CI, scripts, repository tooling) with skip_specs: true: no "Failing tests" section and no test review task. Each task says how that part is proven, and the proof is recorded in the PR'

operations:
  apply:
    guidance:
      - 'Work in two passes. Pass 1 - complete only the "Failing tests" section, run the tests and scripts/check-scenario-coverage.sh, confirm every test fails at its THEN step (not in setup), then push and STOP: ask for test review in the PR with the commit range of pass 1.'
      - 'Pass 1 production code is limited to stubs returning 501 (each marked with a STUB comment) and schema migrations. List both in the PR description: stubs are temporary, migrations are permanent and reviewed as production code.'
      - Test setup must not call endpoints that are not implemented yet; create data and sessions directly.
      - Pass 2 starts only after the engineer approves the tests in the PR. Do not modify approved tests; if one seems wrong, stop and ask the engineer.
      - Finish pass 2 only when the full test suite is green.
      - 'A frontend-only change has one pass: no test review stop (constitution section 2). Write tests and code together and finish when all test commands and scripts/check-scenario-coverage.sh pass.'
      - 'A tooling change with skip_specs: true has no "Failing tests" section and no test review stop. Its tasks say how each part is proven; record the proof in the PR.'
  archive:
    guidance:
      - Before archiving, confirm every scenario ID has a matching test
      - Archive in the change's own PR, before the final code owner review
