schema: spec-driven

context: |
  Project: teachdash — a lightweight teaching platform for teachers of English
  and Russian (lessons, exercises, shared whiteboard, video calls). All learning
  content features must support both target languages; for now only the
  English–Russian pair, without hard-coding it (constitution section 9).
  Language: English. All artifacts must be written in English.
  Keep OpenSpec structural headings and SHALL/MUST keywords in English.
  The project constitution is openspec/constitution.md. Read it before creating
  any artifact and follow it by default. It is guidance, not a blocker: the
  engineer who took the task decides, and may depart from it.
  Stack: Java Spring Boot + PostgreSQL (Flyway) backend, React + TypeScript + Vite
  frontend, Docker Compose on one VPS behind Caddy.

rules:
  proposal:
    - If the engineer clarified the task, start with a "Clarifications" section listing the questions and the engineer's answers
    - If research was done, list its angles and each one's conclusion
    - State what is out of scope
  specs:
    - Every requirement has at least one Given/When/Then scenario
    - Give every scenario a stable ID in the form <capability>/R<n>-S<n>
  design:
    - Justify every new dependency
    - List Flyway migrations the change adds
  tasks:
    - The engineer chooses how tasks are ordered and grouped; there are no mandatory sections or review stops
    - One test per scenario. Backend tests use JUnit 5, Testcontainers and RestAssured with the scenario ID in @DisplayName; frontend tests are Vitest or Playwright with "[<scenario ID>]" at the start of the test title
    - 'For a tooling change with skip_specs: true, each task says how that part is proven, and the proof is recorded in the PR'

operations:
  apply:
    guidance:
      - The engineer decides the order of work, for example tests first (Red, then Green) or tests and code together, and whether to stop for a review at any point.
      - Test setup must not call endpoints that are not implemented yet; create data and sessions directly. Temporary stubs return 501 and are marked with a STUB comment.
      - Finish only when the full test suite and scripts/check-scenario-coverage.sh pass.
      - 'A tooling change with skip_specs: true has tasks that say how each part is proven; record the proof in the PR.'
  archive:
    guidance:
      - Before archiving, confirm every scenario ID has a matching test
      - Archive in the change's own PR, before it is merged
